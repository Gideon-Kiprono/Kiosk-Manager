{% extends "base.html" %}
{% block content %}
<h1>{{ t.login_title }}</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">{{ t.email }}</label>
  <input id="email" name="email" type="email" autocomplete="username" required>

  <label for="password">{{ t.password }}</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <button type="submit" class="primary">{{ t.login_button }}</button>
</form>

<p class="center">{{ t.no_account }} <a href="{{ url_for('register') }}">{{ t.register_link }}</a></p>

<div class="divider"><span>{{ t.or }}</span></div>

<form method="post" action="{{ url_for('demo') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" class="wide">{{ t.demo_button }}</button>
  <small class="center">{{ t.demo_hint }}</small>
</form>
{% endblock %}
