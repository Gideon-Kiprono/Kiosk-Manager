<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ kiosk_name }}{% endblock %} · {{ t.app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top"><strong>{{ kiosk_name }}</strong></header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <nav class="tabs">
    <a href="{{ url_for('stock') }}"  class="{{ 'on' if request.endpoint == 'stock' }}">{{ t.nav_stock }}</a>
    <a href="{{ url_for('sell') }}"   class="{{ 'on' if request.endpoint == 'sell' }}">{{ t.nav_sell }}</a>
    <a href="{{ url_for('add') }}"    class="{{ 'on' if request.endpoint == 'add' }}">{{ t.nav_add }}</a>
    <a href="{{ url_for('report') }}" class="{{ 'on' if request.endpoint == 'report' }}">{{ t.nav_report }}</a>
  </nav>
</body>
</html>
