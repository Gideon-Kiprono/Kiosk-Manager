{% extends "base.html" %}
{% block content %}
<h1>{{ t.register_title }}</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="kiosk_name">{{ t.kiosk_name_label }}</label>
  <input id="kiosk_name" name="kiosk_name" type="text" maxlength="60" required>

  <label for="email">{{ t.email }}</label>
  <input id="email" name="email" type="email" autocomplete="username" required>

  <label for="password">{{ t.password }}</label>
  <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
  <small>{{ t.password_hint }}</small>

  <button type="submit" class="primary">{{ t.register_button }}</button>
</form>
<p class="center">{{ t.have_account }} <a href="{{ url_for('login') }}">{{ t.login_title }}</a></p>
{% endblock %}
