{% extends "base.html" %}
{% block content %}
<h1>{{ t.add_title }}</h1>
<form method="post">
  <label for="name">{{ t.product_name }}</label>
  <input id="name" name="name" type="text" list="known" autocomplete="off" required>
  <datalist id="known">
    {% for p in products %}<option value="{{ p.name }}">{% endfor %}
  </datalist>

  <label for="quantity">{{ t.quantity }}</label>
  <input id="quantity" name="quantity" type="number" inputmode="numeric" min="1" step="1" required>

  <label for="price">{{ t.price_label }}</label>
  <input id="price" name="price" type="number" inputmode="numeric" min="1" step="1">
  <small>{{ t.price_hint }}</small>

  <button type="submit" class="primary">{{ t.add_button }}</button>
</form>
{% endblock %}
